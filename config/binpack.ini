[base]
env_name = binpack

[env]
num_orientations = 2
stability = 1
policy = 0
eval_seeds = 0

[vec]
total_agents = 1024
backend = Serial

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 250_000_000
gamma = 1.0
device = cuda

[sweep]
max_runs = 40
max_suggestion_cost = 900

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 4
scale = auto

[sweep.train.gamma]
distribution = uniform
min = 0.95
max = 1.0
scale = auto
